<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Wallet</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --muted: #8e8e93;
      --accent: #0a84ff;
      --danger: #ff453a;
      --success: #30d158;
      --surface: #1c1c1e;
      --surface-2: #2c2c2e;
      --separator: rgba(84, 84, 88, 0.65);
      --card-radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; overscroll-behavior: none; }

    /* LOCK SCREEN */
    #lock-screen { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease, visibility 0.4s; }
    #lock-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .faceid-ring { width: 120px; height: 120px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.15); position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 28px; }
    .faceid-ring.scanning::before { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--accent); animation: spin 1s linear infinite; }
    .faceid-ring.success { border-color: var(--success); }
    .faceid-icon { width: 56px; height: 56px; opacity: 0.95; }
    .faceid-icon svg { width: 100%; height: 100%; }
    .lock-title { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
    .lock-subtitle { font-size: 15px; color: var(--muted); margin-bottom: 40px; }
    .unlock-btn { background: var(--surface-2); border: none; color: white; padding: 12px 28px; border-radius: 20px; font-size: 16px; font-weight: 500; cursor: pointer; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-bar { height: env(safe-area-inset-top, 44px); background: transparent; }
    .app { height: 100%; display: flex; flex-direction: column; }
    .header { padding: 4px 20px 10px; display: flex; justify-content: space-between; align-items: flex-end; flex-shrink: 0; }
    .header h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.1; }
    .header-actions { display: flex; gap: 18px; padding-bottom: 4px; }
    .icon-btn { background: none; border: none; color: var(--accent); font-size: 17px; font-weight: 400; cursor: pointer; padding: 4px 0; }

    .view { display: none; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px)); }
    .view.active { display: block; }

    .card-stack { padding: 8px 16px 20px; display: flex; flex-direction: column; gap: 14px; min-height: 200px; }
    .wallet-card { position: relative; height: 196px; border-radius: var(--card-radius); overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.3); cursor: grab; background-size: cover; background-position: center; color: white; display: flex; flex-direction: column; justify-content: space-between; padding: 18px 20px; transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s; touch-action: none; }
    .wallet-card:active { cursor: grabbing; }
    .wallet-card.dragging { opacity: 0.9; transform: scale(1.03); box-shadow: 0 12px 40px rgba(0,0,0,0.55); z-index: 50; }
    .wallet-card .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .wallet-card .bank-name { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; text-shadow: 0 1px 3px rgba(0,0,0,0.45); }
    .wallet-card .card-type { font-size: 13px; font-weight: 500; opacity: 0.9; text-shadow: 0 1px 2px rgba(0,0,0,0.35); }
    .wallet-card .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
    .wallet-card .last-four { font-size: 20px; font-weight: 500; letter-spacing: 2.5px; text-shadow: 0 1px 4px rgba(0,0,0,0.5); font-variant-numeric: tabular-nums; }
    .wallet-card .card-network { font-size: 13px; font-weight: 600; opacity: 0.9; text-transform: uppercase; letter-spacing: 0.5px; }

    .bg-blue { background: linear-gradient(145deg, #1a5fb4 0%, #0c3d8a 100%); }
    .bg-black { background: linear-gradient(145deg, #3a3a3c 0%, #1c1c1e 100%); }
    .bg-purple { background: linear-gradient(145deg, #8b3dd9 0%, #4c1d95 100%); }
    .bg-green { background: linear-gradient(145deg, #0d9488 0%, #065f46 100%); }
    .bg-red { background: linear-gradient(145deg, #dc2626 0%, #7f1d1d 100%); }
    .bg-gold { background: linear-gradient(145deg, #eab308 0%, #a16207 100%); color: #1a1a1a; }
    .bg-silver { background: linear-gradient(145deg, #d1d5db 0%, #6b7280 100%); color: #111; }
    .bg-teal { background: linear-gradient(145deg, #14b8a6 0%, #0f766e 100%); }
    .bg-indigo { background: linear-gradient(145deg, #6366f1 0%, #312e81 100%); }
    .bg-rose { background: linear-gradient(145deg, #f43f5e 0%, #9f1239 100%); }

    .add-card-btn { margin: 4px 16px 12px; padding: 15px; background: var(--surface); border: 1.5px dashed rgba(255,255,255,0.22); border-radius: var(--card-radius); color: var(--accent); font-size: 16px; font-weight: 500; text-align: center; cursor: pointer; }
    .hint { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 20px 16px; }

    .detail-header { padding: 0 16px 12px; }
    .back-btn { background: none; border: none; color: var(--accent); font-size: 17px; font-weight: 400; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; margin-bottom: 10px; padding: 4px 0; }
    .detail-card { height: 180px; border-radius: var(--card-radius); margin-bottom: 8px; background-size: cover; background-position: center; padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 6px 20px rgba(0,0,0,0.4); color: white; }
    .detail-card .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .detail-card .bank-name { font-size: 15px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
    .detail-card .card-type { font-size: 13px; opacity: 0.9; }
    .detail-card .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; }
    .detail-card .last-four { font-size: 20px; font-weight: 500; letter-spacing: 2.5px; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
    .detail-card .card-network { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

    .card-actions { display: flex; gap: 10px; margin: 12px 0 20px; }
    .card-actions button { flex: 1; background: var(--surface); border: none; color: var(--accent); padding: 11px; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; }

    .transactions-section { padding: 0 16px; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; padding-left: 2px; }
    .tx-group { background: var(--surface); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
    .transaction { display: flex; align-items: center; padding: 12px 14px; border-bottom: 0.5px solid var(--separator); cursor: pointer; gap: 12px; }
    .transaction:last-child { border-bottom: none; }
    .tx-cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .tx-left { flex: 1; min-width: 0; }
    .tx-merchant { font-size: 16px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-meta { font-size: 13px; color: var(--muted); margin-top: 1px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .tx-amount { font-size: 16px; font-weight: 400; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .tx-amount.credit { color: var(--success); }
    .add-tx-btn { display: block; width: 100%; background: var(--surface); border: none; color: var(--accent); padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 4px; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 15px; }

    .editor-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
    .editor-overlay.open { display: flex; }
    .editor-panel { background: var(--surface); width: 100%; max-width: 500px; max-height: 92vh; border-radius: 14px 14px 0 0; overflow-y: auto; padding: 16px 18px 36px; animation: slideUp 0.28s cubic-bezier(0.32, 0.72, 0, 1); }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .editor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .editor-header h2 { font-size: 18px; font-weight: 600; }
    .close-btn { background: var(--surface-2); border: none; color: white; width: 28px; height: 28px; border-radius: 50%; font-size: 17px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; background: var(--surface-2); border: none; border-radius: 10px; padding: 12px 13px; color: white; font-size: 16px; outline: none; -webkit-user-select: text; user-select: text; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { box-shadow: 0 0 0 2px var(--accent); }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    .color-row { display: flex; gap: 9px; flex-wrap: wrap; }
    .color-swatch { width: 34px; height: 34px; border-radius: 50%; border: 2.5px solid transparent; cursor: pointer; }
    .color-swatch.selected { border-color: white; }
    .btn-row { display: flex; gap: 10px; margin-top: 20px; }
    .btn { flex: 1; padding: 13px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-secondary { background: var(--surface-2); color: white; }
    .upload-area { border: 1.5px dashed rgba(255,255,255,0.28); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; font-size: 14px; }
    .upload-area input { display: none; }
    .preview-img { max-width: 100%; max-height: 100px; border-radius: 8px; margin-top: 8px; }

    .cat-food { background: #ff9f0a; }
    .cat-transport { background: #64d2ff; }
    .cat-shopping { background: #bf5af2; }
    .cat-entertainment { background: #ff375f; }
    .cat-income { background: #30d158; }
    .cat-bills { background: #ac8e68; }
    .cat-health { background: #ff6482; }
    .cat-other { background: #8e8e93; }
  </style>
</head>
<body>
  <div id="lock-screen">
    <div class="faceid-ring" id="faceid-ring">
      <div class="faceid-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 3H5C3.9 3 3 3.9 3 5v2M17 3h2c1.1 0 2 .9 2 2v2M7 21H5c-1.1 0-2-.9-2-2v-2M17 21h2c1.1 0 2-.9 2-2v-2" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="9" cy="10" r="1.3" fill="white"/>
          <circle cx="15" cy="10" r="1.3" fill="white"/>
          <path d="M9.5 15c.8.9 1.9 1.3 2.5 1.3s1.7-.4 2.5-1.3" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <div class="lock-title">Wallet</div>
    <div class="lock-subtitle" id="lock-subtitle">Face ID or Tap to Unlock</div>
    <button class="unlock-btn" id="unlock-btn">Unlock</button>
  </div>

  <div class="app" id="app">
    <div class="status-bar"></div>
    <div id="wallet-view" class="view active">
      <div class="header">
        <h1>Wallet</h1>
        <div class="header-actions">
          <button class="icon-btn" id="edit-mode-btn">Edit</button>
        </div>
      </div>
      <div class="card-stack" id="card-stack"></div>
      <div class="add-card-btn" id="add-card-btn">+ Add Card</div>
      <div class="hint">Hold a card and drag to reorder · Tap Edit to customize</div>
    </div>

    <div id="detail-view" class="view">
      <div class="detail-header">
        <button class="back-btn" id="back-btn">‹ Wallet</button>
        <div class="detail-card" id="detail-card"></div>
        <div class="card-actions">
          <button id="edit-card-btn">Edit Card</button>
          <button id="add-tx-quick">Add Transaction</button>
        </div>
      </div>
      <div class="transactions-section">
        <div class="section-title">Latest Transactions</div>
        <div id="transactions-list"></div>
      </div>
    </div>
  </div>

  <div class="editor-overlay" id="editor-overlay">
    <div class="editor-panel" id="editor-panel"></div>
  </div>

  <script>
    const STORAGE_KEY = 'wallet_sim_v2';
    const CURRENCIES = {
      USD: { symbol: '$', code: 'USD', locale: 'en-US' },
      EUR: { symbol: '€', code: 'EUR', locale: 'de-DE' },
      GBP: { symbol: '£', code: 'GBP', locale: 'en-GB' },
      CAD: { symbol: 'C$', code: 'CAD', locale: 'en-CA' },
      AUD: { symbol: 'A$', code: 'AUD', locale: 'en-AU' },
      JPY: { symbol: '¥', code: 'JPY', locale: 'ja-JP' },
      CHF: { symbol: 'CHF', code: 'CHF', locale: 'de-CH' }
    };
    const CATEGORIES = [
      { id: 'food', label: 'Food & Drink', color: 'cat-food' },
      { id: 'transport', label: 'Transport', color: 'cat-transport' },
      { id: 'shopping', label: 'Shopping', color: 'cat-shopping' },
      { id: 'entertainment', label: 'Entertainment', color: 'cat-entertainment' },
      { id: 'income', label: 'Income', color: 'cat-income' },
      { id: 'bills', label: 'Bills & Utilities', color: 'cat-bills' },
      { id: 'health', label: 'Health', color: 'cat-health' },
      { id: 'other', label: 'Other', color: 'cat-other' }
    ];
    const BG_COLORS = ['bg-blue','bg-black','bg-purple','bg-green','bg-red','bg-gold','bg-silver','bg-teal','bg-indigo','bg-rose'];

    let cards = [];
    let currentCardId = null;
    let dragState = null;

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          cards = JSON.parse(raw);
          cards.forEach(c => {
            if (!c.currency) c.currency = 'USD';
            if (!c.transactions) c.transactions = [];
            c.transactions.forEach(t => {
              if (!t.category) t.category = 'other';
              if (t.note === undefined) t.note = '';
            });
          });
        } else {
          cards = getDefaultCards();
          saveData();
        }
      } catch (e) {
        cards = getDefaultCards();
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
    }

    function getDefaultCards() {
      return [
        {
          id: 'c1', name: 'Platinum Card', lastFour: '4242', network: 'Visa', currency: 'USD', bg: 'bg-blue', customImage: null,
          transactions: [
            { id: 't1', merchant: 'Apple Store', amount: -1299.00, date: '2026-10-03', category: 'shopping', note: 'Fifth Avenue' },
            { id: 't2', merchant: 'Salary Deposit', amount: 4200.00, date: '2026-10-01', category: 'income', note: 'Acme Corp' },
            { id: 't3', merchant: 'Uber', amount: -24.50, date: '2026-09-30', category: 'transport', note: 'Downtown' },
            { id: 't4', merchant: 'Netflix', amount: -15.99, date: '2026-09-28', category: 'entertainment', note: '' }
          ]
        },
        {
          id: 'c2', name: 'Business Black', lastFour: '8899', network: 'Mastercard', currency: 'USD', bg: 'bg-black', customImage: null,
          transactions: [
            { id: 't5', merchant: 'Amazon', amount: -87.32, date: '2026-10-02', category: 'shopping', note: '' },
            { id: 't6', merchant: 'Client Payment', amount: 2500.00, date: '2026-09-29', category: 'income', note: 'Invoice #4221' }
          ]
        }
      ];
    }

    function renderCardStack() {
      const stack = document.getElementById('card-stack');
      stack.innerHTML = '';
      if (cards.length === 0) {
        stack.innerHTML = '<div class="empty-state">No cards yet.<br>Tap “+ Add Card” to create one.</div>';
        return;
      }
      cards.forEach((card, index) => {
        const el = document.createElement('div');
        el.className = 'wallet-card ' + (card.customImage ? '' : card.bg);
        el.dataset.id = card.id;
        el.dataset.index = index;
        if (card.customImage) el.style.backgroundImage = 'url(' + card.customImage + ')';
        el.innerHTML = '<div class="card-top"><div class="bank-name">' + esc(card.name) + '</div><div class="card-type">' + esc(card.network) + '</div></div><div class="card-bottom"><div class="last-four">•••• ' + esc(card.lastFour) + '</div><div class="card-network">' + esc(card.network) + '</div></div>';
        el.addEventListener('click', function() {
          if (dragState && dragState.moved) return;
          openCardDetail(card.id);
        });
        setupDrag(el, index);
        stack.appendChild(el);
      });
    }

    function openCardDetail(id) {
      currentCardId = id;
      const card = cards.find(c => c.id === id);
      if (!card) return;
      document.getElementById('wallet-view').classList.remove('active');
      document.getElementById('detail-view').classList.add('active');
      const detailCard = document.getElementById('detail-card');
      detailCard.className = 'detail-card ' + (card.customImage ? '' : card.bg);
      detailCard.style.backgroundImage = card.customImage ? 'url(' + card.customImage + ')' : '';
      detailCard.innerHTML = '<div class="card-top"><div class="bank-name">' + esc(card.name) + '</div><div class="card-type">' + esc(card.network) + '</div></div><div class="card-bottom"><div class="last-four">•••• ' + esc(card.lastFour) + '</div><div class="card-network">' + esc(card.network) + '</div></div>';
      renderTransactions(card);
    }

    function renderTransactions(card) {
      const list = document.getElementById('transactions-list');
      if (!card.transactions || card.transactions.length === 0) {
        list.innerHTML = '<div class="empty-state">No transactions yet.</div>';
        return;
      }
      const sorted = card.transactions.slice().sort((a, b) => b.date.localeCompare(a.date));
      const currency = CURRENCIES[card.currency] || CURRENCIES.USD;
      let html = '<div class="tx-group">';
      sorted.forEach(tx => {
        const cat = CATEGORIES.find(c => c.id === tx.category) || CATEGORIES[7];
        const meta = [formatDate(tx.date)];
        if (tx.note) meta.push(tx.note);
        meta.push(cat.label);
        html += '<div class="transaction" data-txid="' + tx.id + '"><div class="tx-cat-dot ' + cat.color + '"></div><div class="tx-left"><div class="tx-merchant">' + esc(tx.merchant) + '</div><div class="tx-meta">' + meta.map(esc).join(' · ') + '</div></div><div class="tx-amount ' + (tx.amount > 0 ? 'credit' : '') + '">' + (tx.amount > 0 ? '+' : '') + formatMoney(tx.amount, currency) + '</div></div>';
      });
      html += '</div><button class="add-tx-btn" id="add-tx-btn">+ Add Transaction</button>';
      list.innerHTML = html;
      list.querySelectorAll('.transaction').forEach(el => {
        el.addEventListener('click', function() { openTransactionEditor(card.id, el.dataset.txid); });
      });
      const addBtn = document.getElementById('add-tx-btn');
      if (addBtn) addBtn.onclick = function() { openTransactionEditor(card.id); };
    }

    function setupDrag(el, index) {
      let startY = 0, startIndex = index, currentIndex = index;
      function onStart(clientY) {
        dragState = { moved: false, el: el };
        startY = clientY;
        startIndex = parseInt(el.dataset.index, 10);
        currentIndex = startIndex;
        el.classList.add('dragging');
        el.style.zIndex = '100';
      }
      function onMove(clientY) {
        if (!dragState || dragState.el !== el) return;
        const dy = clientY - startY;
        if (Math.abs(dy) > 6) dragState.moved = true;
        el.style.transform = 'translateY(' + dy + 'px) scale(1.03)';
        const stack = document.getElementById('card-stack');
        const others = Array.from(stack.querySelectorAll('.wallet-card:not(.dragging)'));
        let newIndex = startIndex;
        const rect = el.getBoundingClientRect();
        const midY = rect.top + rect.height / 2;
        others.forEach(function(other) {
          const oRect = other.getBoundingClientRect();
          const oMid = oRect.top + oRect.height / 2;
          const oIdx = parseInt(other.dataset.index, 10);
          if (midY < oMid && oIdx < currentIndex) newIndex = oIdx;
          if (midY > oMid && oIdx > currentIndex) newIndex = oIdx;
        });
        if (newIndex !== currentIndex) {
          const moved = cards.splice(currentIndex, 1)[0];
          cards.splice(newIndex, 0, moved);
          currentIndex = newIndex;
          Array.from(stack.querySelectorAll('.wallet-card')).forEach(function(e, i) { e.dataset.index = i; });
        }
      }
      function onEnd() {
        if (!dragState || dragState.el !== el) return;
        el.classList.remove('dragging');
        el.style.transform = '';
        el.style.zIndex = '';
        saveData();
        renderCardStack();
        setTimeout(function() { dragState = null; }, 50);
      }
      el.addEventListener('touchstart', function(e) {
        if (e.touches.length !== 1) return;
        onStart(e.touches[0].clientY);
      }, { passive: true });
      el.addEventListener('touchmove', function(e) {
        if (!dragState || dragState.el !== el) return;
        e.preventDefault();
        onMove(e.touches[0].clientY);
      }, { passive: false });
      el.addEventListener('touchend', onEnd);
      el.addEventListener('touchcancel', onEnd);
      el.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        onStart(e.clientY);
        function move(ev) { onMove(ev.clientY); }
        function up() {
          onEnd();
          window.removeEventListener('mousemove', move);
          window.removeEventListener('mouseup', up);
        }
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
      });
    }

    function openCardEditor(cardId) {
      const isNew = !cardId;
      const existing = cardId ? cards.find(c => c.id === cardId) : null;
      const card = isNew ? {
        id: uid(), name: '', lastFour: '', network: 'Visa', currency: 'USD', bg: 'bg-blue', customImage: null, transactions: []
      } : Object.assign({}, existing);

      const panel = document.getElementById('editor-panel');
      let colorHtml = '';
      BG_COLORS.forEach(function(c) {
        colorHtml += '<div class="color-swatch ' + c + (card.bg === c && !card.customImage ? ' selected' : '') + '" data-bg="' + c + '"></div>';
      });
      let netHtml = '';
      ['Visa','Mastercard','Amex','Discover','Other'].forEach(function(n) {
        netHtml += '<option value="' + n + '"' + (card.network === n ? ' selected' : '') + '>' + n + '</option>';
      });
      let curHtml = '';
      Object.keys(CURRENCIES).forEach(function(c) {
        curHtml += '<option value="' + c + '"' + (card.currency === c ? ' selected' : '') + '>' + c + ' (' + CURRENCIES[c].symbol + ')</option>';
      });

      panel.innerHTML = '<div class="editor-header"><h2>' + (isNew ? 'Add Card' : 'Edit Card') + '</h2><button class="close-btn" id="close-editor">×</button></div>' +
        '<div class="form-group"><label>Card Name</label><input type="text" id="edit-name" value="' + esc(card.name) + '" placeholder="e.g. Platinum Card" /></div>' +
        '<div class="form-row"><div class="form-group"><label>Last 4 Digits</label><input type="text" id="edit-lastfour" value="' + esc(card.lastFour) + '" maxlength="4" placeholder="4242" inputmode="numeric" /></div>' +
        '<div class="form-group"><label>Network</label><select id="edit-network">' + netHtml + '</select></div></div>' +
        '<div class="form-group"><label>Currency</label><select id="edit-currency">' + curHtml + '</select></div>' +
        '<div class="form-group"><label>Background Color</label><div class="color-row">' + colorHtml + '</div></div>' +
        '<div class="form-group"><label>Custom Card Image (optional)</label><div class="upload-area" id="upload-area">Tap to upload image<input type="file" id="image-upload" accept="image/*" />' +
        (card.customImage ? '<img class="preview-img" src="' + card.customImage + '" />' : '') + '</div>' +
        (card.customImage ? '<button class="btn btn-secondary" id="remove-image" style="width:100%;margin-top:8px;">Remove Image</button>' : '') + '</div>' +
        '<div class="btn-row">' + (!isNew ? '<button class="btn btn-danger" id="delete-card">Delete</button>' : '') +
        '<button class="btn btn-primary" id="save-card">' + (isNew ? 'Add Card' : 'Save') + '</button></div>';

      document.getElementById('editor-overlay').classList.add('open');
      document.getElementById('close-editor').onclick = closeEditor;

      document.querySelectorAll('.color-swatch').forEach(function(sw) {
        sw.onclick = function() {
          document.querySelectorAll('.color-swatch').forEach(function(s) { s.classList.remove('selected'); });
          sw.classList.add('selected');
          card.bg = sw.dataset.bg;
          card.customImage = null;
          const prev = document.querySelector('.preview-img');
          if (prev) prev.remove();
        };
      });

      const uploadArea = document.getElementById('upload-area');
      const fileInput = document.getElementById('image-upload');
      uploadArea.onclick = function(e) { if (e.target.tagName !== 'IMG') fileInput.click(); };
      fileInput.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
          card.customImage = ev.target.result;
          let img = uploadArea.querySelector('.preview-img');
          if (!img) { img = document.createElement('img'); img.className = 'preview-img'; uploadArea.appendChild(img); }
          img.src = card.customImage;
          document.querySelectorAll('.color-swatch').forEach(function(s) { s.classList.remove('selected'); });
        };
        reader.readAsDataURL(file);
      };

      const removeBtn = document.getElementById('remove-image');
      if (removeBtn) {
        removeBtn.onclick = function() {
          card.customImage = null;
          const img = document.querySelector('.preview-img');
          if (img) img.remove();
        };
      }

      document.getElementById('save-card').onclick = function() {
        card.name = document.getElementById('edit-name').value.trim() || 'Card';
        card.lastFour = document.getElementById('edit-lastfour').value.trim().replace(/\D/g,'').slice(0,4) || '0000';
        card.network = document.getElementById('edit-network').value;
        card.currency = document.getElementById('edit-currency').value;
        if (isNew) {
          cards.push(card);
        } else {
          const idx = cards.findIndex(c => c.id === cardId);
          if (idx !== -1) {
            card.transactions = cards[idx].transactions;
            cards[idx] = card;
          }
        }
        saveData();
        closeEditor();
        renderCardStack();
        if (currentCardId === card.id) openCardDetail(card.id);
      };

      const delBtn = document.getElementById('delete-card');
      if (delBtn) {
        delBtn.onclick = function() {
          if (confirm('Delete this card and all its transactions?')) {
            cards = cards.filter(c => c.id !== cardId);
            saveData();
            closeEditor();
            currentCardId = null;
            document.getElementById('detail-view').classList.remove('active');
            document.getElementById('wallet-view').classList.add('active');
            renderCardStack();
          }
        };
      }
    }

    function openTransactionEditor(cardId, txId) {
      const card = cards.find(c => c.id === cardId);
      if (!card) return;
      const isNew = !txId;
      const existing = txId ? card.transactions.find(t => t.id === txId) : null;
      const tx = isNew ? {
        id: uid(), merchant: '', amount: 0, date: new Date().toISOString().slice(0,10), category: 'other', note: ''
      } : Object.assign({}, existing);

      let catHtml = '';
      CATEGORIES.forEach(function(c) {
        catHtml += '<option value="' + c.id + '"' + (tx.category === c.id ? ' selected' : '') + '>' + c.label + '</option>';
      });

      const panel = document.getElementById('editor-panel');
      panel.innerHTML = '<div class="editor-header"><h2>' + (isNew ? 'Add Transaction' : 'Edit Transaction') + '</h2><button class="close-btn" id="close-editor">×</button></div>' +
        '<div class="form-group"><label>Store / Merchant</label><input type="text" id="edit-merchant" value="' + esc(tx.merchant) + '" placeholder="e.g. Apple Store, Starbucks" /></div>' +
        '<div class="form-group"><label>Location or Note (optional)</label><input type="text" id="edit-note" value="' + esc(tx.note || '') + '" placeholder="e.g. Fifth Avenue, Invoice #123" /></div>' +
        '<div class="form-row"><div class="form-group"><label>Amount (negative = spending)</label><input type="number" id="edit-amount" value="' + tx.amount + '" step="0.01" placeholder="-24.50" /></div>' +
        '<div class="form-group"><label>Date</label><input type="date" id="edit-date" value="' + tx.date + '" /></div></div>' +
        '<div class="form-group"><label>Category</label><select id="edit-category">' + catHtml + '</select></div>' +
        '<div class="btn-row">' + (!isNew ? '<button class="btn btn-danger" id="delete-tx">Delete</button>' : '') +
        '<button class="btn btn-primary" id="save-tx">' + (isNew ? 'Add' : 'Save') + '</button></div>';

      document.getElementById('editor-overlay').classList.add('open');
      document.getElementById('close-editor').onclick = closeEditor;

      document.getElementById('save-tx').onclick = function() {
        tx.merchant = document.getElementById('edit-merchant').value.trim() || 'Transaction';
        tx.note = document.getElementById('edit-note').value.trim();
        tx.amount = parseFloat(document.getElementById('edit-amount').value) || 0;
        tx.date = document.getElementById('edit-date').value || new Date().toISOString().slice(0,10);
        tx.category = document.getElementById('edit-category').value;
        if (isNew) {
          card.transactions.push(tx);
        } else {
          const idx = card.transactions.findIndex(t => t.id === txId);
          if (idx !== -1) card.transactions[idx] = tx;
        }
        saveData();
        closeEditor();
        renderTransactions(card);
      };

      const delBtn = document.getElementById('delete-tx');
      if (delBtn) {
        delBtn.onclick = function() {
          card.transactions = card.transactions.filter(t => t.id !== txId);
          saveData();
          closeEditor();
          renderTransactions(card);
        };
      }
    }

    function closeEditor() {
      document.getElementById('editor-overlay').classList.remove('open');
    }

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function esc(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function formatMoney(amount, currency) {
      const abs = Math.abs(amount);
      const formatted = new Intl.NumberFormat(currency.locale, {
        style: 'currency', currency: currency.code,
        minimumFractionDigits: currency.code === 'JPY' ? 0 : 2
      }).format(abs);
      return amount < 0 ? '−' + formatted : formatted;
    }
    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T12:00:00');
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function initLockScreen() {
      const lock = document.getElementById('lock-screen');
      const ring = document.getElementById('faceid-ring');
      const subtitle = document.getElementById('lock-subtitle');
      const btn = document.getElementById('unlock-btn');
      function unlock() {
        ring.classList.add('scanning');
        subtitle.textContent = 'Scanning…';
        setTimeout(function() {
          ring.classList.remove('scanning');
          ring.classList.add('success');
          subtitle.textContent = 'Authenticated';
          setTimeout(function() { lock.classList.add('hidden'); }, 400);
        }, 1100);
      }
      btn.onclick = unlock;
      lock.addEventListener('click', function(e) {
        if (e.target === lock || e.target.closest('.faceid-ring') || e.target.closest('.faceid-icon')) unlock();
      });
    }

    document.getElementById('back-btn').onclick = function() {
      document.getElementById('detail-view').classList.remove('active');
      document.getElementById('wallet-view').classList.add('active');
      currentCardId = null;
      renderCardStack();
    };
    document.getElementById('add-card-btn').onclick = function() { openCardEditor(); };
    document.getElementById('edit-mode-btn').onclick = function() {
      if (cards.length) openCardEditor(cards[0].id); else openCardEditor();
    };
    document.getElementById('edit-card-btn').onclick = function() {
      if (currentCardId) openCardEditor(currentCardId);
    };
    document.getElementById('add-tx-quick').onclick = function() {
      if (currentCardId) openTransactionEditor(currentCardId);
    };
    document.getElementById('editor-overlay').addEventListener('click', function(e) {
      if (e.target.id === 'editor-overlay') closeEditor();
    });

    loadData();
    renderCardStack();
    initLockScreen();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function() {});
    }
  </script>
</body>
</html>
